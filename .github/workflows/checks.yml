name: Bot checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip check
      - run: python -m statezero --config config.example.json --check
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pip-audit==2.10.1 ruff==0.17.0
      - run: ruff check statezero tests tools main.py
      - run: ruff format --check statezero tests tools main.py
      - run: pip-audit -r requirements.lock --no-deps --disable-pip
      - run: python tools/load_test.py --actions 5000 --concurrency 64 --output /tmp/statezero-load.json
